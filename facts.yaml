version: 1
commit: 8b16149741a4935e1dec8cea27853f273b374c5b
repository: https://github.com/deepseek-ai/DeepInfer
qa_path: doc/DeepSeek V4.1 Flash 推理部署 Q&A.pdf
facts:
  - id: release.scope
    source: readme
    ref: README.md:3
    status: confirmed
    zh: >-
      DeepInfer 开源的是支撑离线推理的核心引擎。此版本支持 DeepSeek-V4.1-Flash，目标硬件为 NVIDIA SM100 与华为 Ascend 950。完整在线服务还需要缓存、分离部署与负载均衡设施；不能把生产系统总览理解成仓库中已提供的整套服务。
    en: >-
      DeepInfer releases the core engine for offline inference. This version supports DeepSeek-V4.1-Flash on NVIDIA SM100 and Huawei Ascend 950. A complete online service additionally needs cache infrastructure, disaggregated deployment, and load balancing. The production-system overview therefore describes a larger system than the runnable open-source release.
  - id: system.disaggregation
    source: qa_pdf
    ref: "p.2 · 推理系统设计概览"
    status: confirmed
    zh: >-
      带图片的对话先经过协议转换与编码，再进行前缀匹配和 Prefill 路由。Vision Encoder 生成图片 embedding，Prefill 处理输入，Decode 逐步产生输出，最后由 Recipe 转回流式协议。生产系统将 E、P、D 与存储分开部署，让它们各自调整资源；图中的路径是阅读顺序，不能据此假设所有工作都严格串行执行。
    en: >-
      A conversation containing an image first passes through protocol conversion and encoding, followed by prefix matching and prefill routing. A vision encoder supplies image embeddings; prefill processes the input; decode produces output incrementally; Recipe converts the result into a streamed response. Production separates E, P, D, and storage so their resources can be adjusted independently. The diagram is a reading order, not a claim that every operation is strictly serialized.
  - id: system.parallelism
    source: qa_pdf
    ref: "p.2 · 并行策略"
    status: confirmed
    values: { prefillMin: 2, prefillMax: 8, decodeMin: 64, decodeMax: 128 }
    zh: >-
      Q&A 的生产建议是 Prefill 使用 EP2–8 / DP2–8，显存允许时尽量缩小并行组；Decode 使用 EP64–128 / DP64–128，硬件允许时扩大专家并行。Attention 使用数据并行，MoE 使用专家并行。Vision Encoder 通常单卡部署。这里描述的是生产配置建议，不是开源引擎支持的全部并行能力。
    en: >-
      The Q&A recommends EP2–8 / DP2–8 for prefill, keeping the group small when memory permits, and EP64–128 / DP64–128 for decode, increasing expert parallelism when hardware permits. Attention uses data parallelism while MoE uses expert parallelism. The vision encoder generally runs on a single device. These are production recommendations, rather than a complete list of parallel configurations supported by the engine.
  - id: system.minimum
    source: qa_pdf
    ref: "p.3 · 最小部署单元"
    status: confirmed
    values: { prefill: 64, decode: 64 }
    zh: >-
      Q&A 区分“能够部署”与“较高效率”：1P + 1D 也能部署；考虑到 Decode 推荐的专家并行规模及实践中的资源比例，高效的最小单元为 64 卡 Prefill + 64 卡 Decode。这不是运行示例程序的最低硬件门槛，也不代表任何工作负载都应该照搬这个比例。
    en: >-
      The Q&A distinguishes a deployable configuration from an efficient production unit. A 1P + 1D deployment is possible, while the recommended decode parallelism and observed resource ratio lead to an efficient minimum of 64 prefill devices plus 64 decode devices. This is not the minimum hardware requirement for an example program, nor a universal sizing rule for every workload.
  - id: zos.serial
    source: qa_pdf
    ref: "p.9 · Asynchronous Scheduling · 优化目标"
    status: confirmed
    zh: >-
      同步解码的顺序为 schedule(N) → forward(N) → sample(N) → post-process(N)。后处理必须先取得采样结果；当 CPU 做后处理和下一轮调度时，GPU 可能没有新任务可执行。问题在于依赖链造成的等待，而不是这段 CPU 工作本身没有必要。
    en: >-
      Synchronous decoding follows schedule(N), forward(N), sample(N), then post-process(N). Post-processing must first obtain the sampled result. While the CPU processes that result and schedules the next batch, the GPU can run out of queued work. The problem is the dependency-induced wait, rather than the existence of necessary CPU work.
  - id: zos.overlap
    source: qa_pdf
    ref: "p.9 · Asynchronous Scheduling · 实现方法"
    status: confirmed
    zh: >-
      异步调度让 GPU 的 forward(N) → sample(N) 与 CPU 的 schedule(N+1) → launch_forward(N+1) → post-process(N−1) → launch_sample(N+1) 重叠。CPU 处理的是更早完成的结果，而不是等待当前批。图中无间隙的稳态是一种理想化示意；不能由它推出任意实际负载的 GPU 空闲率恒为零。
    en: >-
      Asynchronous scheduling overlaps GPU forward(N) and sample(N) with CPU schedule(N+1), launch_forward(N+1), post-process(N−1), and launch_sample(N+1). The CPU processes an older completed result instead of waiting for the current batch. A gap-free steady-state illustration is an idealization; it does not imply that every real workload has zero GPU idle time.
  - id: zos.remap
    source: code
    ref: csrc/engine/zos.cpp:142
    status: confirmed
    zh: >-
      批次会加入新请求，也会移除完成的请求，因此跨轮复用不能只按行号对应。prepare_zos_inputs 根据序列标识建立 remap；已有请求可关联上一批的 GPU 输出，新请求走新输入路径。阅读时间线时，需要把“调度提前”和“输入对应关系修正”一起理解。
    en: >-
      Batches gain new requests and lose completed ones, so reuse across iterations cannot assume that row positions remain stable. prepare_zos_inputs builds a remapping by sequence identity. Continuing requests can be associated with previous GPU outputs, while new requests use fresh inputs. Scheduling ahead and correcting input correspondence are complementary parts of the pipeline.
  - id: eplb.strategy
    source: qa_pdf
    ref: "pp.3–4 · Wide-EP 与专家并行负载均衡"
    status: confirmed
    zh: >-
      Wide-EP 将专家分散到更大的设备组，减少每步每卡需要读取的专家权重。热门专家仍会造成慢卡；EPLB 在设备上预留冗余槽位，为热门专家放置副本，并依据近期负载周期性重排。逻辑专家没有变成新的模型参数种类，增加的是物理副本。网格中的卡数、专家编号与热度只用于解释布局。
    en: >-
      Wide-EP distributes experts across a larger device group, reducing the expert-weight traffic each device handles per step. Popular experts can still create stragglers. EPLB reserves redundant slots, places replicas of heavily used experts, and periodically changes placement using recent load statistics. A physical replica is not a new kind of model parameter. Device counts, expert labels, and heat levels in the grid illustrate placement only.
  - id: eplb.prefill
    source: qa_pdf
    ref: "p.4 · Prefill 的 EPLB 策略"
    status: confirmed
    values: { redundant: 4, window: 100, interval: 1000, moeEP4: 1.074, moeEP2: 1.045 }
    zh: >-
      Prefill 从每卡 4 个冗余专家起步，并向上填充，使总专家数可被 ep_size 整除；统计最近 100 步，每 1000 步重排。Q&A 报告 EP4DP4 的 moe_lb 为 1.074，EP2DP2 为 1.045。它们是指定配置下的观测值，不能当成所有负载的保证。
    en: >-
      Prefill starts with 4 redundant experts per device and rounds upward so the total expert count is divisible by ep_size. It uses a 100-step statistics window and rebalances every 1000 steps. The Q&A reports moe_lb of 1.074 for EP4DP4 and 1.045 for EP2DP2. These are observations under those configurations, not guarantees for arbitrary workloads.
  - id: eplb.decode
    source: qa_pdf
    ref: "p.4 · Decode 的 EPLB 策略"
    status: confirmed
    values: { redundant: 1, window: 1000, interval: 10000, moe: 1.090 }
    zh: >-
      Decode 从每卡 1 个冗余专家起步，统计窗为 1000 步，重排周期为 10000 步。Q&A 的 EP64 示例取整后每卡共有 7 个专家，不计共享专家，报告的 moe_lb 为 1.090。moe_lb 定义为最慢 rank 的负载除以平均负载，越接近 1 表示越均衡。
    en: >-
      Decode starts with 1 redundant expert per device, uses a 1000-step window, and rebalances every 10000 steps. In the Q&A's EP64 example, rounding gives 7 experts per device excluding shared experts, with a reported moe_lb of 1.090. This metric divides the slowest rank's load by the average load; values closer to 1 indicate better balance.
  - id: eplb.code
    source: code
    ref: deepinfer/model_executor/eplb/policy.py:73
    status: confirmed
    zh: >-
      策略代码区分 logical expert 与 physical expert，输出逻辑到物理的映射。副本分配与物理放置都依据负载进行；权重搬运则在 shuffle 模块完成。读图时应把路由选择、专家副本和设备之间的权重迁移分开，它们分别回答“执行谁”“放在哪”“如何搬过去”。
    en: >-
      The policy distinguishes logical experts from physical experts and produces their mapping. Load informs replica allocation and placement, while the shuffle module moves weights. Routing, replication, and movement answer different questions: which expert executes, where its copies live, and how weights reach that location.
  - id: yoco.ced
    source: qa_pdf
    ref: "p.7 · KVCache 重算与命中 · Decoder SWA Bounded Replay"
    status: confirmed
    zh: >-
      CED 将因果 encoder 与 decoder 接起来。Encoder 处理完整的待计算输入；decoder 的 Block KV 来自 encoder 末层 hidden state 的投影，不需要让所有 decoder 层对整段 prompt 再做一次完整计算。但各层自己的 SWA 状态仍需恢复。图中 Block KV 的共享路径与 SWA 的回放路径因此分开表示。
    en: >-
      CED connects a causal encoder to a decoder. The encoder processes the complete input that still needs computation. Decoder Block KV is projected from the final encoder hidden states, rather than requiring every decoder layer to recompute the whole prompt. Layer-local SWA state still needs reconstruction, so the diagram separates the shared Block KV path from the SWA replay path.
  - id: yoco.replay
    source: qa_pdf
    ref: "p.7 · KVCache 重算与命中 · 重算方式"
    status: confirmed
    values: { window: 128, rollback: 6, margin: 134, block: 128 }
    zh: >-
      Q&A 用最近 128 个 token 的有界回放近似重建 SWA 状态：从 s 开始回放，位置 i 只关注 [max(s, i−127), i]。Decoder 侧的精确重建原本需要 20 层处理末尾 2560 个 token；改用有界回放后，总 Prefill 计算量近乎减半。Encoder 在前缀 SWA 缺失时回放命中前缀末尾；Decoder 每次 Prefill 都回放 prompt 末尾，结果仅供 Decode，不进前缀缓存。
    en: >-
      The Q&A describes approximate SWA reconstruction by replaying the latest 128 tokens. Starting at s, query position i sees only [max(s, i−127), i]. Exact decoder reconstruction would require 20 layers to process the final 2560 tokens. With bounded replay, total prefill computation is nearly halved. Encoder replay repairs the matched-prefix tail when prefix SWA is missing. Decoder replay handles the prompt tail on every prefill; its output serves decode and is excluded from the prefix cache.
  - id: yoco.config
    source: readme
    ref: README.md:25
    status: confirmed
    values: { keepTokens: 140 }
    zh: >-
      锁定版本 README 的实际 compact 示例使用 KEEP_TOKENS=140，并要求保留后缀覆盖窗口及最大回退。Q&A 的回放窗口 128、命中安全余量 134 与示例配置 140 属于不同口径；不能把教学窗口直接复制成运行配置。此处并列保留来源中的数值，不推断配置额外余量的设计动机。
    en: >-
      The pinned README's compact-mode example uses KEEP_TOKENS=140 and requires the retained suffix to cover the window and maximum backtracking. The Q&A's replay window of 128, cache-hit margin of 134, and example configuration of 140 describe different quantities. Do not copy the teaching window directly into a deployment configuration. We preserve these source values without inventing a rationale for the additional configuration margin.
  - id: yoco.equivalence
    source: readme
    ref: examples/yoco/README.md:1
    status: confirmed
    zh: 仓库提供 mask 与 compact 两种 YOCO 截断实现的等价性检查，覆盖元数据以及兼容模型下的输出比较。这是在相同截断语义下比较实现，不代表有界回放与完整历史的精确重建完全相同。
    en: The repository provides equivalence checks between mask and compact YOCO truncation, covering metadata and output comparisons with a compatible model. This compares implementations under the same truncation semantics; it does not equate bounded replay with exact full-history reconstruction.
  - id: swa.hit
    source: qa_pdf
    ref: "p.7 · KVCache 重算与命中 · 命中策略"
    status: confirmed
    zh: >-
      对输入长度 L，Block KV 命中长度 L1 不得超过 L−134，且按 128 对齐。若 L1−128 到 L1 范围内有可用 SWA 状态，则保持命中长度；否则回退到 L1−128 并重算末尾一块。回放用于恢复 SWA，已命中的 Block KV 继续复用，不重算也不覆写。短输入与零命中在演示中截断到非负范围。
    en: >-
      For input length L, the Block KV hit length L1 is aligned to 128 and cannot exceed L−134. If usable SWA state exists between L1−128 and L1, the hit length is retained; otherwise execution falls back to L1−128 and replays the final block. Replay rebuilds SWA while reusing existing Block KV without recomputation or overwrite. The demonstration clamps short-input and zero-hit cases to nonnegative values.
  - id: storage.block
    source: qa_pdf
    ref: "pp.5–6 · KVCache 存储 · Block KVCache"
    status: confirmed
    zh: >-
      Block KV 包含 Main KV 与 Indexer K，持久化到独立的 3FS 存储集群。所有 Prefill 机器都能查询前缀，因此路由不必为了命中缓存而固定到某台计算机器。计算节点故障与扩缩容也不再直接决定这些持久化缓存的存活。该架构来自官方 Q&A，相关服务没有包含在此次开源发布中。
    en: >-
      Block KV contains Main KV and Indexer K and is persisted in an independent 3FS storage cluster. Prefill machines can access prefixes without routing every matching request back to one compute host. Compute failures and scaling decisions therefore do not directly determine the lifetime of that persistent cache. This architecture comes from the official Q&A; those services are outside this release.
  - id: storage.ec
    source: qa_pdf
    ref: "pp.3–4 · 3FS 分布式文件系统"
    status: confirmed
    values: { data: 10, parity: 2, request: 11, response: 10 }
    zh: >-
      3FS 使用 10+2 纠删码保存数据。读取时向同组 11 个节点发请求，任意 10 个响应即可恢复数据，从而减少对某个慢响应的等待。冗余片段和读取请求数是不同概念；图中“发 11、取 10”表示一次读取策略，而不是把编码方案改成 11 个片段。
    en: >-
      3FS stores data with 10+2 erasure coding. A read issues requests to 11 nodes in the group and can reconstruct data from any 10 responses, reducing dependence on one slow response. Stored redundancy and read fan-out are different quantities: “request 11, use 10” describes the read policy, not an encoding scheme with 11 fragments.
  - id: storage.pipeline
    source: qa_pdf
    ref: "p.6 · Cache 相关开销如何 overlap"
    status: confirmed
    zh: >-
      Entrypoint 先做哈希链前缀匹配，只读元数据，命中长度必须在路由前算出。取 KV 的独立进程把数据从 3FS 搬到宿主机共享内存 shm，engine 内的线程再通过 GDR 换入 HBM，目标是让逐层传输与前向计算重叠。前缀查询本身不能被这段后续流水线隐藏。
    en: >-
      Entrypoint performs hash-chain prefix matching against metadata before routing, because the hit length is needed for that decision. A separate process fetches KV from 3FS into host shared memory, and a thread in the engine moves it into HBM using GDR. The goal is to overlap layer-wise transfer with forward computation. The earlier prefix lookup is not hidden by this later pipeline.
  - id: storage.swa
    source: qa_pdf
    ref: "pp.6–7 · SWA KVCache"
    status: confirmed
    zh: >-
      SWA KV 使用 state cache 中的定长 slot，不放进分页 Block KV。需要保存的窗口与可重建区域分开；SWA 留在产生它的机器内存中，由 Entrypoint 的分布式目录记录位置，命中后可以跨机取回。它没有随 Block KV 一起持久化到 SSD；两种缓存可共享 PD 传输链路，却有不同的保存与恢复策略。
    en: >-
      SWA KV occupies fixed-size slots in the state cache rather than paged Block KV storage. Persisted window regions and reconstructible regions are separated. SWA remains in the originating machine's memory, with a distributed Entrypoint directory recording its location for remote retrieval. It is not persisted to SSD alongside Block KV. The two caches share a PD transfer path but have different retention and recovery policies.
  - id: storage.ttl
    source: qa_pdf
    ref: "p.6 · 过期与 TTL"
    status: confirmed
    values: { agent: 3, chatbot: 7 }
    zh: >-
      Q&A 报告 agent 流量的 KVCache TTL 达到 3 天，chatbot 流量达到 7 天。回收由 3FS 的 GC 处理，而非 kvcache-store 自行判定过期。这些是特定生产存储规模和访问分布下的保留情况，不是开源库内置的服务承诺。
    en: >-
      The Q&A reports KVCache TTLs of 3 days for agent traffic and 7 days for chatbot traffic. Reclamation is handled by 3FS garbage collection rather than expiration logic in kvcache-store. These retention figures describe a particular production storage capacity and access distribution; they are not built-in service guarantees of the open-source library.
  - id: lb.prefill
    source: qa_pdf
    ref: "p.4 · 数据并行负载均衡 · Prefill"
    status: confirmed
    zh: >-
      Prefill 按上下文总长分成 4 档：小于 16K、16–64K、64–256K、至少 256K。各档资源依据上一轮 compute-quota 需求重新分配；组间按剩余预算拉取请求，组内交给预算负载最低的 rank。共享缓存使这里可以按计算负载路由，而不必维持前缀亲和。
    en: >-
      Prefill divides requests into 4 context-length tiers: below 16K, 16–64K, 64–256K, and at least 256K. Resources are reassigned using the preceding round's compute-quota demand. Groups pull work according to remaining quota, and a group assigns requests to its least-loaded rank. Shared cache access allows routing by compute load without prefix affinity.
  - id: lb.chunk
    source: qa_pdf
    ref: "p.4 · Prefill Load Balancer · 单卡内"
    status: confirmed
    zh: >-
      单卡按 FIFO 取请求，但 chunk size 并不固定。调度器用拟合的二次模型 cost(q,c) 估计时间，再反解本轮能处理的 q，并同时受 32,768 token 上限与剩余时间预算约束。q 是本轮序列长度，c 是已计算前缀长度。不要把仓库中的 FLOPs 记账器当作这个未开源时间模型的完整实现。
    en: >-
      A device dequeues requests in FIFO order, but chunk size is not fixed. The scheduler estimates time using a fitted quadratic cost(q,c), then solves for q under both a 32,768-token cap and the remaining time quota. Here q is the sequence's work for this iteration and c is its computed prefix length. The repository's FLOPs accounting utility is not the complete implementation of this unreleased timing model.
  - id: lb.decode
    source: qa_pdf
    ref: "p.5 · Decode 与 Vision Encoder Load Balancer"
    status: confirmed
    zh: >-
      Decode 同时均衡请求数与 KV 总长度：前者影响批大小，后者影响 Attention 代价。短请求可补给并发较小而 KV 总长较大的卡，长请求则优先交给 KV 总长较小的卡。Vision Encoder 先选择机器，再按正在处理的图片 patch 数选择卡；图片张数相同并不意味着编码工作量相同。
    en: >-
      Decode balances both request count and total KV length. The former affects batch size; the latter affects attention cost. Short requests can go to devices with lower concurrency but more existing KV, while long requests favor devices with less KV. Vision routing chooses a machine and then a device by outstanding image patch count. Equal image counts do not necessarily imply equal encoding work.
  - id: recipe.encode
    source: qa_pdf
    ref: "p.10 · DeepSeek Recipe · API 与 Tokenizer"
    status: confirmed
    zh: >-
      Recipe 把不同 API 协议转成统一对话格式，再按模型模板编码。模板显式插入的 special token 直接映射为 token ID；用户文本中外观相同的字符串仍作为普通文本编码。普通文本可按 special token 的边界分段并行处理，最后按原顺序拼接，避免把用户内容误当成控制标记。
    en: >-
      Recipe converts supported API protocols to a common conversation format and encodes it with the model template. Explicitly inserted special tokens map directly to token IDs, while visually identical strings in user content remain ordinary text. Ordinary spans can be encoded independently between special-token boundaries and then reassembled in order, without treating user text as a control marker.
  - id: recipe.stream
    source: qa_pdf
    ref: "p.10 · DeepSeek Recipe · 流式输出解析"
    status: confirmed
    zh: >-
      输出 chunk 不一定对应完整字符或完整标签。解析器缓冲不完整的 UTF-8 字符，维护正文、思考与工具参数状态，并用 KMP 延续跨 chunk 的分隔符匹配。已确认的内容可以立即输出，不必重新扫描先前文本，也不必等工具参数对象全部生成后再返回。
    en: >-
      An output chunk need not contain a complete character or tag. The parser buffers incomplete UTF-8 characters, tracks text, reasoning, and tool-argument states, and continues delimiter matching across chunks using KMP. Confirmed content can be emitted immediately without rescanning earlier text or waiting for an entire tool-argument object to finish.
  - id: so.pipeline
    source: qa_pdf
    ref: "pp.9–10 · 结构化输出"
    status: confirmed
    zh: >-
      结构化输出先异步编译格式约束，请求进入 engine 前取回结果。运行时每轮更新语法自动机，找出合法 token，并把 mask 作用到采样上。它约束的是生成格式，例如 JSON schema、正则或 EBNF；格式符合要求并不自动证明内容的事实正确性。
    en: >-
      Structured output compiles format constraints asynchronously and retrieves the result before the request enters the engine. Each decoding iteration updates a grammar automaton, determines legal tokens, and applies a mask during sampling. This constrains formats such as JSON schema, regex, or EBNF. Format validity alone does not establish the factual correctness of the generated content.
  - id: dspark.method
    source: qa_pdf
    ref: "pp.8–9 · 投机解码"
    status: confirmed
    values: { drafts: 5 }
    zh: >-
      DSpark 一次生成 5 个 draft token，用 Confidence Head 预测接受率。调度结合硬件 profile 曲线，把验证预算分配给预期边际收益较高的位置。网页用单请求前缀选择解释这个直觉；生产调度在批内跨请求分配总预算，不能把网页的局部最优直接当成生产决策。
    en: >-
      DSpark generates 5 draft tokens and predicts acceptance using a Confidence Head. Scheduling combines those predictions with a hardware profile curve to allocate verification budget to positions with higher expected marginal value. This page explains the intuition through a single request's prefix. Production allocates a total budget across requests in a batch, so the local optimum here is not the production decision.
  - id: dspark.cumulative
    source: code
    ref: deepinfer/model_executor/layers/tilelang_ops/cuda/schedule_mtp_varlen.py:26
    status: confirmed
    zh: >-
      GPU kernel 对逐位置 confidence 做累乘，再按累计概率进行全局排名并分配长度。教学公式取 E(k)=1+Σⱼ₌₁ᵏ∏ᵢ₌₁ʲpᵢ，再除以示意步耗时 T(k)，包含不验证 draft 的候选 k=0。置信度是估计值，不代表每次执行都接受相同数量的 token。
    en: >-
      The GPU kernel multiplies position-wise confidence values cumulatively, ranks the resulting probabilities globally, and allocates lengths. The teaching model uses E(k)=1+Σⱼ₌₁ᵏ∏ᵢ₌₁ʲpᵢ divided by an illustrative step time T(k), including k=0 with no verified draft. Confidence values are estimates, not a promise that each execution accepts the same number of tokens.
  - id: dspark.results
    source: qa_pdf
    ref: "p.9 · 相比 fixed-5"
    status: confirmed
    zh: >-
      Q&A 报告 fixed-5 与动态验证的每步验证数为 5.00 → 3.2–4.4，平均接受长度为 3.29 vs 3.20；按 EP64/DP64、每 rank 约 60 并发的生产运行点估算，吞吐收益为 +4–7%。这些是官方报告数字，与下面可调示意参数产生的结果分开呈现。
    en: >-
      The Q&A reports verification counts of 5.00 → 3.2–4.4 and mean acceptance lengths of 3.29 versus 3.20 for fixed and dynamic verification. At the production operating point of EP64/DP64 and about 60 concurrent requests per rank, it estimates +4–7% throughput. These reported figures are separate from results generated by the adjustable illustrative parameters below.
  - id: dspark.zos
    source: qa_pdf
    ref: "p.9 · 与 Asynchronous Scheduling 的配合"
    status: confirmed
    zh: >-
      异步调度时，CPU 做下一轮调度尚拿不到当前轮 confidence，因此只确定总预算；GPU 上的 TileLang kernel 用最新可用结果重算每个请求的长度，进行累乘、全局排名与 remap scatter，再回写 pinned buffer。动态验证和异步调度必须共同处理这个信息时差。
    en: >-
      With asynchronous scheduling, the CPU schedules ahead before the current confidence values have returned, so it chooses only the total budget. A TileLang kernel on the GPU uses the latest available results to recompute per-request lengths, perform cumulative multiplication and global ranking, and scatter through remapping before writing a pinned buffer. Dynamic verification and asynchronous execution must jointly handle this information lag.
  - id: model.mhc
    source: code
    ref: deepinfer/model_executor/models/v4_modules/mhc_ops.py:95
    status: inferred
    zh: >-
      代码导读：mHC 路径调用 Sinkhorn 归一化，配合多路 residual 的混合。这里仅描述调用与数据关系，不从实现反推训练稳定性结论。官方模型卡提到 Single-Pass mHC，但模型卡并不能替代对锁定推理代码每条分支的核实。
    en: >-
      Code reading: the mHC path calls Sinkhorn normalization alongside mixing of multiple residual streams. This describes calls and data relationships, without inferring training-stability conclusions from inference code. The official model card mentions Single-Pass mHC, but that overview does not independently validate every branch in the pinned runtime.
  - id: model.engram
    source: code
    ref: deepinfer/model_executor/models/v4_modules/engram.py:108
    status: inferred
    zh: >-
      代码导读：Engram 根据 n-gram 的哈希获取分片 embedding，经过融合投影，再通过 gate 注入 hidden states。查表、投影与门控是不同步骤；图中不将它画成向外部文档发起检索，也不补充未经官方材料证实的能力解释。
    en: >-
      Code reading: Engram fetches sharded embeddings by n-gram hash, applies a fused projection, and gates the result into hidden states. Lookup, projection, and gating are distinct operations. The diagram does not present this as retrieval from an external document collection or add capability claims unsupported by official material.
  - id: model.index
    source: code
    ref: deepinfer/model_executor/models/v4_modules/index_attn.py:57
    status: inferred
    zh: >-
      代码导读：稀疏 indexer 为 query 计算分数并选择 top-k 的压缩 KV；跨层拓扑分别管理 KV、indexer K 与索引的共享映射。消费者读取前面的来源层，部分路径还使用候选块缩小后续选择范围。图示只展开这些接口关系，具体配置仍以 checkpoint 与代码校验为准。
    en: >-
      Code reading: the sparse indexer scores queries and selects top-k compressed KV entries. Cross-layer topology separately manages sharing of KV, indexer K, and selected indices. Consumers read from earlier source layers; some paths narrow later selection to candidate blocks. The illustration describes these interfaces, while concrete configuration remains subject to checkpoint values and code validation.
  - id: model.precision
    source: qa_pdf
    ref: "pp.6–8 · SWA KVCache 与低精度计算"
    status: confirmed
    zh: >-
      低精度格式须按对象区分：Q&A 将 Main KV 的缩放描述为 per-16、e4m3；Indexer KV 与 MoE 路由专家权重使用 per-32、ue8m0、MXFP4。SWA KV 的存储格式在另一节标为 MXFP8。不能把所有权重、缓存与计算统称为同一种 FP4 格式。
    en: >-
      Precision formats must be distinguished by object. The Q&A describes Main KV scaling as per-16 with e4m3; Indexer KV and routed-expert weights use per-32 ue8m0 MXFP4. A separate storage section describes SWA KV as MXFP8. We should not label all weights, caches, and computation as one uniform FP4 format.
  - {"id": "bg.autoregressive", "source": "background", "ref": "Vaswani et al., Attention Is All You Need, §3", "url": "https://arxiv.org/html/1706.03762v7", "status": "confirmed", "zh": "自回归模型根据已有序列预测下一个 token，并把生成结果加入后续输入。", "en": "Autoregressive models predict the next token from the existing sequence and feed generated tokens back into later steps."}
  - {"id": "bg.sampling", "source": "background", "ref": "Leviathan et al., Speculative Decoding, §2.2", "url": "https://arxiv.org/html/2211.17192", "status": "confirmed", "zh": "采样按模型输出经解码规则调整后的概率选择 token；贪心选择是取最大概率的特殊规则。", "en": "Sampling selects tokens from probabilities adjusted by decoding rules; greedy selection picks the highest-probability token."}
  - {"id": "bg.token", "source": "background", "ref": "Hugging Face Transformers, Tokenization algorithms", "url": "https://huggingface.co/docs/transformers/main/en/tokenizer_summary", "status": "confirmed", "zh": "Tokenizer 把文本转为词表中的 token 序列，token 不一定等于一个字或单词。", "en": "A tokenizer maps text to vocabulary tokens; a token need not be a word or a character."}
  - {"id": "bg.special_token", "source": "background", "ref": "Hugging Face Transformers, PreTrainedTokenizer, special tokens", "url": "https://huggingface.co/docs/transformers/main_classes/tokenizer", "status": "confirmed", "zh": "特殊 token 表示序列开始、结束等控制信息，与普通文本片段承担不同角色。", "en": "Special tokens carry control information such as sequence boundaries rather than ordinary text fragments."}
  - {"id": "bg.representation", "source": "background", "ref": "Vaswani et al., §3.1–3.4", "url": "https://arxiv.org/html/1706.03762v7", "status": "confirmed", "zh": "Embedding 把 token 映射为向量；隐藏状态是各层更新后的内部向量。注意力用 Q 与 K 的匹配给 V 加权，残差连接把子层输出加回输入。", "en": "Embeddings map tokens to vectors. Hidden states are intermediate representations; attention weights values V using query Q and key K compatibility. Residual connections add a sublayer output to its input."}
  - {"id": "bg.kv_cache", "source": "background", "ref": "Kwon et al., PagedAttention, §2.1–2.2, §3; generalized tensor-shape accounting", "url": "https://arxiv.org/html/2309.06180", "status": "confirmed", "zh": "KV 缓存保存已处理位置的键和值，避免生成时重复计算。对单序列、各层 KV 头数相同且 K/V 头维度相同的普通未压缩全注意力，缓存字节数为 2 × token 数 × 层数 × KV 头数 × 头维度 × 每元素字节数；固定其余参数时随长度线性增长。该公式不包含分页开销，不适用于直接估算 CED 压缩缓存。", "en": "KV caching retains keys and values of processed positions. For a single sequence with uniform KV head counts across layers and equal K/V dimensions, uncompressed full-attention cache bytes = 2 × tokens × layers × KV heads × head dimension × bytes per element. This excludes allocation overhead and is not a CED cache estimator."}
  - {"id": "bg.prefix", "source": "background", "ref": "Zheng et al., SGLang, §3 RadixAttention", "url": "https://arxiv.org/html/2312.07104", "status": "confirmed", "zh": "前缀缓存按相同的起始 token 序列复用 KV；命中指找到可兼容复用的已计算前缀，不是文字语义相近。", "en": "Prefix caching reuses KV for matching initial token sequences. A hit requires compatible cached state, not semantic similarity."}
  - {"id": "bg.prefill_decode", "source": "background", "ref": "Zhong et al., DistServe, §2–3", "url": "https://arxiv.org/html/2401.09670", "status": "confirmed", "zh": "Prefill 并行处理已知输入；普通 Decode 每请求每步处理 1 个新位置。较长输入的 Prefill 往往受算力限制，小批量 Decode 往往受显存带宽限制；批量和硬件会改变瓶颈。分离部署允许两阶段独立分配资源。", "en": "Prefill processes known input positions together; ordinary decode handles 1 new position per request per step. Long prefills tend to be compute-bound and small decode batches bandwidth-bound. Workload and hardware matter; disaggregation permits independent resource allocation."}
  - {"id": "bg.batching", "source": "background", "ref": "Yu et al., Orca, abstract and iteration-level scheduling", "url": "https://www.usenix.org/conference/osdi22/presentation/yu", "status": "confirmed", "zh": "批处理让多个请求一起执行；连续批处理在迭代边界调整成员，让完成的请求退出、新请求加入。", "en": "Batching executes requests together. Iteration-level scheduling can replace completed requests with new requests at iteration boundaries."}
  - {"id": "bg.chunk", "source": "background", "ref": "Agrawal et al., Sarathi, §4.2", "url": "https://arxiv.org/html/2308.16369", "status": "confirmed", "zh": "Chunked prefill 把长输入拆成较小的连续计算块，允许调度器在块之间安排其他请求。", "en": "Chunked prefill divides a long prompt into smaller consecutive work units, allowing other requests to be scheduled between chunks."}
  - {"id": "bg.moe", "source": "background", "ref": "Dai et al., DeepSeekMoE, §2, §3.2–3.3", "url": "https://arxiv.org/html/2401.06066", "status": "confirmed", "zh": "MoE 门控为每个 token 选择少量路由专家；共享专家不参与同样的择优选择。路由可能集中到少数设备，因此设备负载均衡影响效率。", "en": "An MoE gate selects a small subset of routed experts for each token. Shared experts are used separately from that selection. Uneven routing can concentrate work on some devices."}
  - {"id": "bg.parallel", "source": "background", "ref": "Shoeybi et al., Megatron-LM, §3 and Appendix A", "url": "https://arxiv.org/html/1909.08053", "status": "confirmed", "zh": "数据并行 DP 让相同模型副本处理不同数据；张量并行 TP 把同一层的矩阵计算拆到多个设备，随后通信合并结果。", "en": "Data parallelism uses model replicas on different data. Tensor parallelism partitions a layer computation across devices and communicates to assemble results."}
  - {"id": "bg.ep", "source": "background", "ref": "DeepEP README, introduction", "url": "https://github.com/deepseek-ai/DeepEP", "status": "confirmed", "zh": "专家并行 EP 把专家放到不同设备；dispatch 把 token 表示送往专家，combine 把结果送回并合并，形成 all-to-all 通信。", "en": "Expert parallelism places experts on different devices. Dispatch routes token representations to experts and combine returns their results through all-to-all communication."}
  - {"id": "bg.swa", "source": "background", "ref": "Jiang et al., Mistral 7B, §2", "url": "https://arxiv.org/html/2310.06825", "status": "confirmed", "zh": "因果滑动窗口注意力只直接读取当前位置附近的历史位置。固定窗口的滚动缓存有界；较远信息仍可经多层传递。", "en": "Causal sliding-window attention directly reads a local history window. A rolling cache is bounded by that window, while information can travel farther across layers."}
  - {"id": "bg.yoco", "source": "background", "ref": "Sun et al., YOCO, §2, Figure 2", "url": "https://arxiv.org/html/2405.05254", "status": "confirmed", "zh": "YOCO 的 self-decoder 构造供 cross-decoder 共享的全局 KV，两部分都保持因果性，整体用于自回归生成。它不是翻译模型中输入编码器与输出解码器的分工。", "en": "YOCO uses a self-decoder to produce global KV shared by a cross-decoder. Both are causal parts of an autoregressive model, unlike a translation encoder and output decoder."}
  - {"id": "bg.speculative", "source": "background", "ref": "Leviathan et al., §2.1, §3.1, §3.3", "url": "https://arxiv.org/html/2211.17192", "status": "confirmed", "zh": "投机解码先产生草稿，再由目标模型并行验证，接受有效前缀。接受率影响每次验证的平均产出；利用闲置算力可能减少串行步数，收益还取决于草稿与验证成本。", "en": "Speculative decoding drafts tokens and verifies them in parallel with the target model. Acceptance determines expected progress; speedup also depends on drafting and verification costs."}
  - {"id": "bg.cuda", "source": "background", "ref": "NVIDIA CUDA Programming Guide, §2.5.1–2.5.3", "url": "https://docs.nvidia.com/cuda/cuda-programming-guide/02-basics/asynchronous-execution.html", "status": "confirmed", "zh": "Kernel launch 提交 GPU 内核工作，异步调用返回不代表设备已完成。CUDA stream 按顺序组织操作；依赖关系仍需正确同步。", "en": "A kernel launch submits GPU work. Returning from an asynchronous call does not mean completion. CUDA streams order operations, and dependencies still require synchronization."}
  - {"id": "bg.graph", "source": "background", "ref": "NVIDIA CUDA Programming Guide, §4.2", "url": "https://docs.nvidia.com/cuda/cuda-programming-guide/04-special-topics/cuda-graphs.html", "status": "confirmed", "zh": "CUDA Graph 把重复工作及依赖预先定义并实例化，然后重复启动整个图，减少逐操作的 CPU 提交开销。", "en": "CUDA Graphs predefine and instantiate repeated work and its dependencies, reducing CPU submission overhead when replayed."}
  - {"id": "bg.constraints", "source": "background", "ref": "Dong et al., XGrammar, §2.1–2.2", "url": "https://arxiv.org/html/2411.15100", "status": "confirmed", "zh": "约束解码跟踪语法状态，用 token mask 排除当前不合法的候选；满足语法并不保证内容真实。复杂语法可能需要带栈的自动机。", "en": "Constrained decoding tracks grammar state and masks invalid next tokens. Grammar validity is distinct from factual correctness; complex grammars can require a stack-based automaton."}
  - {"id": "bg.sse", "source": "background", "ref": "WHATWG HTML, §9.2 Server-sent events", "url": "https://html.spec.whatwg.org/multipage/server-sent-events.html", "status": "confirmed", "zh": "SSE 通过持久连接发送事件文本，使用 UTF-8 编码，并按事件格式解析。网络读取边界不等于完整事件边界。", "en": "Server-sent events carry UTF-8 event text over a persistent connection. Network read boundaries need not coincide with complete events."}
  - {"id": "bg.fp8", "source": "background", "ref": "Micikevicius et al., FP8 Formats for Deep Learning, §2–3", "url": "https://arxiv.org/html/2209.05433", "status": "confirmed", "zh": "FP8 使用 8 位表示数值；E4M3 与 E5M2 的指数和尾数字段分配不同，在数值范围和精细程度间取舍。缩放让数据适应有限范围。", "en": "FP8 stores numbers in 8 bits. E4M3 and E5M2 allocate different exponent and mantissa widths, trading range against precision; scaling fits data into that range."}
  - {"id": "bg.mx", "source": "background", "ref": "OCP Microscaling Formats v1.0, §5.1–5.4, pp.9–14", "url": "https://www.opencompute.org/documents/ocp-microscaling-formats-mx-v1-0-spec-final-pdf", "status": "confirmed", "zh": "MX 格式让一块元素共享缩放因子，元素格式与缩放格式分别定义，包括 MXFP4 与 MXFP8。缩放粒度描述多少元素共用一个缩放值。", "en": "MX formats share a scale across a block of elements, with separate element and scale formats, including MXFP4 and MXFP8. Scaling granularity describes how many elements share a scale."}
  - {"id": "bg.erasure", "source": "background", "ref": "Ceph documentation, Erasure code profiles and glossary", "url": "https://docs.ceph.com/en/latest/rados/operations/erasure-code/", "status": "confirmed", "zh": "纠删码把对象分成 k 个数据块并增加 m 个编码块。在所选编码与故障模型允许的范围内，可从剩余块恢复丢失的数据。", "en": "Erasure coding divides data into k data chunks and adds m coding chunks. Recovery depends on the code and the number of lost chunks."}
  - {"id": "bg.gdr", "source": "background", "ref": "NVIDIA GPUDirect RDMA, §1 Overview", "url": "https://docs.nvidia.com/cuda/gpudirect-rdma/", "status": "confirmed", "zh": "GPUDirect RDMA 为 GPU 与兼容网卡等设备提供直接数据交换路径，减少经 CPU 内存中转；具体支持依赖硬件、驱动与拓扑。", "en": "GPUDirect RDMA enables direct exchange between GPU memory and compatible peer devices, avoiding a host-memory staging path where supported."}
  - {"id": "bg.metrics", "source": "background", "ref": "Zhong et al., DistServe, §2.2, §3, evaluation", "url": "https://arxiv.org/html/2401.09670", "status": "confirmed", "zh": "TTFT 衡量首 token 等待时间，TPOT 衡量后续每 token 时间；吞吐衡量单位时间完成量，goodput 只计满足延迟目标的服务能力。吞吐增加可能伴随延迟增加，不能只看最高吞吐。", "en": "TTFT measures first-token delay; TPOT measures subsequent token time. Throughput counts completed work; goodput accounts for latency objectives. Higher throughput can come with higher latency."}
  - {"id": "bg.sinkhorn", "source": "background", "ref": "Nathanson, Matrix scaling and explicit doubly stochastic limits, abstract", "url": "https://arxiv.org/abs/1905.09426", "status": "confirmed", "zh": "Sinkhorn 归一化对元素严格为正的正方阵交替缩放行与列，使其趋向行和、列和均为单位值的双随机矩阵。", "en": "Sinkhorn normalization alternately rescales rows and columns of a strictly positive square matrix toward a doubly stochastic matrix."}
  - {"id": "bg.ngram", "source": "background", "ref": "DeepSeek V4.1 technical report, §2.4.2 p.13", "url": "https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf", "status": "confirmed", "zh": "n-gram 是连续的 token 片段；哈希查表把片段映射到有限表的地址，再读取向量。地址相同不保证片段相同。", "en": "An n-gram is a consecutive token fragment. Hash lookup maps fragments to finite table addresses to retrieve vectors; different fragments can share an address."}
  - {"id": "bg.sparse", "source": "background", "ref": "DeepSeek V4.1 technical report, §2.3 pp.9–11", "url": "https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf", "status": "confirmed", "zh": "稀疏注意力的 top-k 选择先对候选位置评分，再只对选中位置做主要注意力计算；索引选择与 KV 数据是不同对象。", "en": "Top-k sparse attention scores candidate positions and selects a subset for attention. Selected indices are distinct from the KV data they identify."}
  - {"id": "bg.pareto", "source": "background", "ref": "pymoo, Preface: Basics and Challenges", "url": "https://pymoo.org/getting_started/preface.html", "status": "confirmed", "zh": "Pareto 前沿由不能在不损害其他目标的同时继续改进的方案组成。读吞吐与延迟图时，先确认两个坐标的优劣方向，再比较相同工作负载。", "en": "A Pareto front contains solutions that cannot improve one objective without worsening another. Check axis directions and compare equivalent workloads."}
  - {"id": "bg.utilization", "source": "background", "ref": "NVIDIA System Management Interface, Utilization", "url": "https://docs.nvidia.com/deploy/nvidia-smi/index.html", "status": "confirmed", "zh": "nvidia-smi 的 GPU 利用率统计采样期间有内核运行的时间占比，不代表计算单元已发挥全部峰值算力。", "en": "nvidia-smi GPU utilization reports the fraction of a sampling period with active kernels, not the fraction of peak arithmetic capacity achieved."}
  - {"id": "bg.utf", "source": "background", "ref": "WHATWG Encoding Standard, §8.1", "url": "https://encoding.spec.whatwg.org/#utf-8-decoder", "status": "confirmed", "zh": "UTF-8 字符可能由多个字节组成。流式解码器保留未完成字符的状态，收到足够字节后才输出该字符。", "en": "UTF-8 characters may span multiple bytes. A streaming decoder retains incomplete character state until enough bytes arrive."}
